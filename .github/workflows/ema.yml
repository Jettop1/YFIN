name: EMA cross
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Invia un messaggio di prova su Telegram"
        type: boolean
        default: true
  # il controllo periodico lo avvia cron-job.org (ogni ora al minuto 5)
  repository_dispatch:
    types: [check]
permissions:
  contents: write   # serve per salvare state.json (ultimo incrocio notificato)
concurrency:
  group: ema-cross
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python check_cross.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST: ${{ inputs.test }}
      - name: Salva stato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Update alert state"
            git pull --rebase -q
            git push -q
          fi
